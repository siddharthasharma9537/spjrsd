name: Weekly Panchangam Digest

on:
  schedule:
    - cron: '30 0 * * 1'  # Every Monday, 6:00 AM IST (00:30 UTC)
  workflow_dispatch: {}   # allows manually running this from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly panchangam digest
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://spjrsd-backend.onrender.com' }}
        run: |
          curl -sf -X POST "${BACKEND_URL}/api/cron/panchangam-digest" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
