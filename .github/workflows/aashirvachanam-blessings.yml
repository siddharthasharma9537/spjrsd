name: Daily Aashirvachanam Blessings

on:
  schedule:
    - cron: '30 0 * * *'  # Every day, 6:00 AM IST (00:30 UTC)
  workflow_dispatch: {}   # allows manually running this from the Actions tab

jobs:
  send-blessings:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily Aashirvachanam blessings
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://spjrsd-backend.onrender.com' }}
        run: |
          curl -sf -X POST "${BACKEND_URL}/api/cron/aashirvachanam-blessings" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
